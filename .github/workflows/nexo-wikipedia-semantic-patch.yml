name: Apply semantic Wikipedia intent patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat: improve semantic Wikipedia intent detection') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/api/chat/route.ts')
          text = path.read_text(encoding='utf-8')
          new = r'''function shouldSearchWikipedia(query: string): boolean {
            const value = query.trim();
            if (!value || value.length > 1000) return false;

            const normalized = value
              .toLocaleLowerCase('en-US')
              .replace(/[“”‘’]/g, "'")
              .replace(/\s+/g, ' ')
              .trim();

            if (/\b(wikipedia|encyclopedia|wiki page|wiki article)\b|විකිපීඩියා|විශ්වකෝෂ/i.test(normalized)) return true;

            const nonWikipediaIntent = /\b(?:code|coding|program|programming|debug|debugging|error|bug|fix|implement|implementation|typescript|javascript|python|react|next\.js|nextjs|sql|supabase|vercel|github|api|api route|component|function|regex|terminal|npm|package|compile|build|deploy|deployment|translate|translation|translate this|rewrite|rephrase|proofread|email|caption|poem|poetry|song|lyrics|story|creative writing|write a story|roleplay)\b|පරිවර්තනය|පරිවර්තනය කරන්න|කෝඩ්|කේතය|කේත|වැරැද්ද|දෝෂය|ඩිබග්|ක්‍රමලේඛ|කතාවක් ලිය|කවියක් ලිය/i;
            if (nonWikipediaIntent.test(normalized)) return false;

            const currentness = /\b(?:current|currently|right now|now|today|latest|recent|recently|present|at present|as of|this year|this month|this week|in \d{4}|\d{4})\b|\b(?:president|prime minister|king|queen|leader|governor|minister|ceo|chairperson)\b|දැනට|වත්මන්|වර්තමානයේ|අලුත්ම|නවතම|මෑතකදී|මේ වසරේ|මේ මාසේ|මේ මාසයේ|මේ සතියේ|\b20\d{2}\b|ජනාධිපති|අගමැති|රජු|රැජින|නායකයා|ආණ්ඩුකාර|ඇමති/i;
            const factualQuestion = /\b(?:who is|who was|who were|what is|what are|what was|what were|where is|where was|where are|when was|when were|which|whose|how did|why did|what happened|tell me about|information about|facts about|history of|biography of|define|definition of|meaning of|explain)\b|\b(?:who|what|where|when)\b|කවුද|කවුරුද|මොකක්ද|මොකක්|මොනවාද|මොනවද|කොහෙද|කොහේද|කවදාද|කවදා|ගැන කියන්න|ගැන විස්තර|විස්තර කරන්න|තොරතුරු|ඉතිහාසය|ජීවිත කතාව|අර්ථය|නිර්වචනය|පැහැදිලි කරන්න|සිදුවුණේ|සිදු වුණේ|ඇයි|කොහොමද/i;
            const encyclopedicTopic = /\b(?:history|historical|biography|person|people|country|city|capital|president|prime minister|government|politician|scientist|artist|actor|actress|author|book|film|movie|company|organization|university|landmark|monument|war|battle|empire|kingdom|religion|language|culture|science|technology|planet|moon|star|animal|species|disease|event|invention|founder|born|died|population|geography)\b|ඉතිහාස|ජීවිත|පුද්ගල|රට|නගර|අගනුවර|රජය|දේශපාල|විද්‍යා|කලා|නළුව|නිළිය|කර්තෘ|පොත|චිත්‍රපට|සමාගම|සංවිධානය|විශ්වවිද්‍යාල|ස්මාරක|යුද්ධ|රාජධානි|භාෂාව|සංස්කෘති|විද්‍යාව|තාක්ෂණ|ග්‍රහලෝක|සත්ත්ව|විශේෂ|ජනගහනය|භූගෝල|නව නිපැයුම්/i;

            const isQuestion = /\?/.test(normalized);
            const hasCurrentness = currentness.test(normalized);
            const hasFactualQuestion = factualQuestion.test(normalized);
            const hasEncyclopedicTopic = encyclopedicTopic.test(normalized);

            if (hasFactualQuestion) return true;
            if (hasCurrentness && (hasFactualQuestion || hasEncyclopedicTopic)) return true;
            if (hasEncyclopedicTopic && isQuestion) return true;
            return false;
          }'''
          pattern = re.compile(r"function shouldSearchWikipedia\(query: string\): boolean \{.*?\n\}\n\nfunction buildCurrentDateTimeContext", re.S)
          patched, count = pattern.subn(lambda _: new + "\n\nfunction buildCurrentDateTimeContext", text, count=1)
          if count != 1:
              raise SystemExit('shouldSearchWikipedia target not found exactly once')
          path.write_text(patched, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          grep -q "const nonWikipediaIntent" app/api/chat/route.ts
          git diff --check
          rm -f .github/workflows/nexo-wikipedia-semantic-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/chat/route.ts .github/workflows/nexo-wikipedia-semantic-patch.yml
          git commit -m "feat: improve semantic Wikipedia intent detection"
          git push
