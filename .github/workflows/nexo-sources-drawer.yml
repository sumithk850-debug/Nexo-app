name: NEXO Sources Drawer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Integrate sources drawer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/MessageBubble.tsx')
          s = p.read_text()
          if 'WikipediaSourcesDrawer' not in s:
              s = s.replace('import { authenticatedFetch } from "@/lib/authFetch";', 'import { authenticatedFetch } from "@/lib/authFetch";\nimport { WikipediaSourcesDrawer } from "./WikipediaSourcesDrawer";')
          old = '''        {!isStreaming && wikipediaSources.length > 0 && (\n          <div className="mt-3 flex flex-wrap items-center gap-1.5" aria-label="Wikipedia sources">\n            <span className="inline-flex items-center gap-1 rounded-full border border-sky-400/20 bg-sky-400/10 px-2 py-1 text-[10px] font-semibold text-sky-200">\n              <BookOpen className="h-3 w-3" aria-hidden="true" /> Wikipedia\n            </span>\n            {wikipediaSources.map((source) => (\n              <a\n                key={source.url}\n                href={source.url}\n                target="_blank"\n                rel="noreferrer"\n                className="inline-flex max-w-[16rem] items-center gap-1 rounded-full border border-edge bg-panel px-2 py-1 text-[10px] text-ink-muted transition hover:border-sky-400/40 hover:text-sky-200"\n                title={source.title}\n              >\n                <span className="truncate">{source.title}</span>\n                <ExternalLink className="h-2.5 w-2.5 flex-shrink-0" aria-hidden="true" />\n              </a>\n            ))}\n          </div>\n        )}'''
          new = '''        {!isStreaming && wikipediaSources.length > 0 && (\n          <div className="mt-3 flex flex-wrap items-center gap-1.5" aria-label="Wikipedia sources">\n            <WikipediaSourcesDrawer sources={wikipediaSources} />\n          </div>\n        )}'''
          if old not in s:
              raise SystemExit('Expected Wikipedia source block not found')
          s = s.replace(old, new, 1)
          s = s.replace(', BookOpen, ExternalLink', '')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/MessageBubble.tsx
          git diff --cached --quiet || git commit -m "feat: integrate premium Wikipedia sources drawer"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/nexo-sources-drawer.yml
          git add .github/workflows/nexo-sources-drawer.yml
          git commit -m "chore: remove temporary sources drawer workflow" || true
          git push || true
