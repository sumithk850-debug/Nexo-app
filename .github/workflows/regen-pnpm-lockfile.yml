name: Regenerate pnpm lockfile

on:
  push:
    branches:
      - fix/pnpm-lockfile
    paths:
      - ".github/workflows/regen-pnpm-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pnpm-lockfile
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile from package.json
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Remove temporary workflow and commit lockfile
        run: |
          git rm .github/workflows/regen-pnpm-lockfile.yml
          git add pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: sync pnpm lockfile with package manifest"
          git push origin fix/pnpm-lockfile
