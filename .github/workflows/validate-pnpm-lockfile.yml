name: Validate pnpm lockfile

on:
  push:
    branches:
      - fix/pnpm-lockfile
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/validate-pnpm-lockfile.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pnpm-lockfile
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify frozen lockfile install
        run: pnpm install --frozen-lockfile --ignore-scripts
